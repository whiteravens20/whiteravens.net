# All human-readable copy for whiteravens.net lives here.
# Layout, styling and behaviour live in src/components — this file is content only.

meta:
  title: White Ravens — an open, independent corner of the internet
  description: >-
    White Ravens is a small collective building an open and independent corner
    of the internet — self-hosted services, open source software, and a
    community that values privacy.

hero:
  eyebrow: Open source · Self-hosted · Privacy-first
  title: White Ravens
  tagline: >-
    A small collective building an open, independent corner of the internet —
    powered by free software, services we host ourselves, and a community that
    values privacy.
  ctaDocs: Explore the docs
  ctaBlog: Read the blog
  ctaGithub: GitHub

# The visor around the logo. Every readout states a fact about the site or the collective;
# a row with `link` shows that address from src/config/site.ts.
hud:
  bannerLabel: '// principles'
  banner: open · self-hosted · private
  # short labels under the four pillar glyphs, in the order of the pillars below
  cells: [cmn, sft, srv, knw]
  gauge: waveform
  # the panel that links to the pillars; the count comes from them
  nodes:
    title: Nodes
    active: nodes active
  source:
    title: Source
    rows:
      - { key: code, link: github }
      - { key: licences, value: MIT · AGPL-3.0 }
      - { key: this site, value: static · Astro }
  privacy:
    title: Privacy
    rows:
      - { key: cookies, value: '0' }
      - { key: ads, value: '0' }
      - { key: accounts needed, value: '0' }
  hosting:
    title: Hosting
    rows:
      - { key: infrastructure, value: our own }
      - { key: docs, link: docs }
      - { key: status, link: status, value: status page }
  manifest:
    title: Manifest
    items:
      - { name: community, note: people first }
      - { name: software, note: open source, documented }
      - { name: services, note: self-hosted, ad-free }
      - { name: knowledge, note: free to read }
  projects:
    title: Projects
    items:
      - { name: archivum-null, note: encrypted file sharing }
      - { name: raven-forge, note: Minecraft launcher }
      - { name: darknode, note: browser hacking game }
      - { name: exemplar, note: Discord bot }
      - { name: diet-app, note: meal planning }
      - { name: raven-packs, note: Minecraft modpacks }
  log:
    title: Boot log
    rows:
      - { key: fonts, value: self-hosted }
      - { key: icons, value: self-hosted }
      - { key: csp, value: enforced }
      - { key: scripts, value: own servers only }
      - { key: visit counter, value: cookie-free }
      - { key: build, value: static }
  notice:
    - no cookies
    - no ads
    - no accounts needed
    - all assets self-hosted
    - open source
    - documented for self-hosting

pillars:
  heading: What we do
  intro: >-
    We build open-source software, run services on our own infrastructure
    for the community, and share what we learn along the way.
  items:
    - id: community
      title: Community
      body: >-
        We are a community of gamers, tech tinkerers and open-source
        enthusiasts. We believe in a free and open internet, value good
        conversations, and enjoy learning from one another.
    - id: software
      title: Software
      body: >-
        We build and publish our own open-source software, from small tools to
        full self-hostable applications. Everything is documented so anyone can
        use it, run it themselves, or build on it, and we run it ourselves as
        part of our services.
    - id: services
      title: Services
      # [text](key) in a body is a link; the key names an address in src/config/site.ts
      body: >-
        We run services for the community on our own infrastructure:
        [open-source tools we recommend](home) and find useful, and the
        software we build ourselves. All of them are free and ad-free, each one
        is documented, and a public status page shows how they are doing.
    - id: knowledge
      title: Knowledge
      body: >-
        We write down what we learn running all of this: engineering notes on
        the blog, guides in the documentation, and videos on our channel.
        Everything is free to read.

links:
  heading: Find us around the web
  blog: Blog
  youtube: YouTube
