# ── Dependabot configuration ──────────────────────────────────────────────────
# Keeps GitHub Actions and npm dependencies up to date automatically.
# Opens PRs against `dev`, weekly for npm and monthly for actions — CI must pass
# before merging.

version: 2

updates:
  - package-ecosystem: github-actions
    # Actions are pinned to commit SHAs; Dependabot moves the SHA and the
    # version comment beside it together.
    #
    # Let a newly published version settle for a week before proposing it. A
    # release can be yanked or a tag repointed in the hours after it lands, and
    # none of these bumps is urgent. A pinned action gets no Dependabot alert,
    # so the "Actions audit" job in security.yml watches the advisory database
    # instead.
    cooldown:
      default-days: 7
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
      time: "08:00"
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    # Minor and patch updates in one pull request; a major comes on its own.
    groups:
      actions-non-breaking:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    # Let a newly published version settle for a week before proposing it. A
    # release can be yanked or a tag repointed in the hours after it lands, and
    # none of these bumps is urgent. Dependabot security updates are exempt
    # from cooldown and still open the moment an advisory lands.
    cooldown:
      default-days: 7
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
    # Group all non-breaking updates into a single PR to reduce noise.
    # Security updates are always opened as separate PRs regardless.
    groups:
      non-breaking:
        update-types:
          - minor
          - patch
