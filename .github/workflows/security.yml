name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly on Monday at 09:00 UTC
    - cron: '0 9 * * 1'

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Everything here is a build-time dependency (the site ships static
      # files), so a single high bar keeps the signal useful.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Verify every installed tarball has a valid registry signature.
      # Requires a fresh install since `audit signatures` reads node_modules.
      - name: Install (for signature audit)
        run: npm ci --ignore-scripts

      - name: Verify signatures
        run: npm audit signatures

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Only runs on pull requests — compares new deps against known vulnerabilities
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # Every action in these workflows is pinned to a commit SHA, with its version
  # in a comment. This checks that each SHA is the commit of the version named
  # beside it, so a wrong SHA and a tag moved upstream both fail here.
  pins:
    name: Pinned actions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check each SHA against the tag it names
        run: .github/scripts/verify-pins.sh

  # Dependabot raises no alert for an action pinned by SHA, so this asks GitHub's
  # advisory database about every pinned version in its place.
  actions-audit:
    name: Actions audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Look up each pinned version in the advisory database
        run: .github/scripts/verify-pins.sh --advisories
        env:
          GH_TOKEN: ${{ github.token }}
